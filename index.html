<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVAFRAX STUDIOS | A Shift in Perspective</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .hero-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .hero-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
    }
    /* منطقة الأزرار التفاعلية لمطابقة مكان السوشيال ميديا بالصورة */
    .social-clickable-zone {
      position: absolute;
      bottom: 12%;
      display: flex;
      gap: 30px;
      z-index: 10;
    }
    .social-btn {
      width: 70px;
      height: 60px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .social-btn:hover {
      opacity: 0.15;
      background: #fff;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="hero-container">
    <img src="hero.png" alt="Novafrax Studios" class="hero-image">
    
    <!-- مناطق النقر للسوشيال ميديا -->
    <div class="social-clickable-zone">
      <a href="https://youtube.com/@rajulbiummah" target="_blank" class="social-btn" title="YouTube"></a>
      <a href="https://instagram.com" target="_blank" class="social-btn" title="Instagram"></a>
      <a href="https://tiktok.com" target="_blank" class="social-btn" title="TikTok"></a>
    </div>
  </div>

</body>
</html>
