<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVAFRAX STUDIOS | A Shift in Perspective</title>
  <meta name="description" content="Independent cinematic studio. Different worlds. Different stories. A Shift in Perspective.">
  <meta name="theme-color" content="#050506">
  <meta property="og:title" content="NOVAFRAX STUDIOS">
  <meta property="og:description" content="A Shift in Perspective.">
  <meta property="og:url" content="https://novafraxstudios.com">
  <meta property="og:type" content="website">
  <style>
    :root {
      --bg: #050506;
      --gold: #e7a646;
      --gold-soft: #b87925;
      --silver: #f3efe8;
      --muted: #9c9a97;
      --line: rgba(231,166,70,.28);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      background:
        radial-gradient(circle at 50% 33%, rgba(231,166,70,.11) 0%, rgba(231,166,70,.035) 18%, transparent 44%),
        linear-gradient(180deg, #070708 0%, #050506 62%, #030304 100%);
      color: var(--silver);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 3px 3px;
      opacity: .1;
      mix-blend-mode: soft-light;
    }

    .page {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 5vh 24px 28px;
      text-align: center;
      isolation: isolate;
    }

    .brand-glow {
      position: absolute;
      width: 540px;
      height: 540px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(231,166,70,.11) 0%, rgba(231,166,70,.035) 28%, transparent 70%);
      filter: blur(12px);
      top: 10%;
      z-index: -2;
    }

    .mark-wrap {
      width: clamp(210px, 25vw, 340px);
      margin-bottom: 8px;
      position: relative;
      filter: drop-shadow(0 18px 38px rgba(0,0,0,.55));
    }

    .mark-wrap::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      width: 78%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,203,116,.92), transparent);
      box-shadow: 0 0 18px rgba(255,184,72,.85), 0 0 42px rgba(255,154,0,.35);
      opacity: .8;
      pointer-events: none;
    }

    .mark-wrap img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      clip-path: inset(0 0 48% 0);
      transform: scale(1.9);
      transform-origin: 50% 21%;
      filter: saturate(.86) contrast(1.06) brightness(1.03);
    }

    .brand-name {
      margin-top: -88px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.45rem, 5.1vw, 4.8rem);
      letter-spacing: .26em;
      text-indent: .26em;
      font-weight: 500;
      text-transform: uppercase;
      background: linear-gradient(180deg, #fffdf9 8%, #d8d2c8 42%, #8b8177 72%, #f0c58a 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 7px 25px rgba(0,0,0,.5);
      line-height: .95;
    }

    .studios {
      margin-top: 14px;
      font-size: clamp(.82rem, 1.35vw, 1.15rem);
      letter-spacing: .64em;
      text-indent: .64em;
      text-transform: uppercase;
      color: #d5c6b4;
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 18px;
    }

    .studios::before,
    .studios::after {
      content: "";
      width: clamp(46px, 9vw, 120px);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-soft));
    }

    .studios::after { background: linear-gradient(90deg, var(--gold-soft), transparent); }

    .tagline {
      margin-top: 24px;
      color: #aaa7a4;
      font-size: clamp(.72rem, 1vw, .92rem);
      letter-spacing: .46em;
      text-indent: .46em;
      text-transform: uppercase;
      font-weight: 300;
    }

    .status {
      margin-top: 46px;
      padding: 12px 36px;
      border: 1px solid rgba(231,166,70,.58);
      border-radius: 999px;
      color: #f0b552;
      font-size: .76rem;
      letter-spacing: .38em;
      text-indent: .38em;
      text-transform: uppercase;
      background: linear-gradient(180deg, rgba(231,166,70,.055), rgba(231,166,70,.018));
      box-shadow: inset 0 0 18px rgba(231,166,70,.03), 0 0 26px rgba(0,0,0,.22);
    }

    .social-links {
      margin-top: 34px;
      display: flex;
      align-items: stretch;
      justify-content: center;
      flex-wrap: wrap;
      border-top: 1px solid transparent;
    }

    .social-links a {
      min-width: 122px;
      padding: 8px 24px;
      color: #a39d97;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: .21em;
      font-size: .7rem;
      transition: .25s ease;
      position: relative;
    }

    .social-links a + a::before {
      content: "";
      position: absolute;
      left: 0;
      top: 4px;
      bottom: 4px;
      width: 1px;
      background: rgba(255,255,255,.11);
    }

    .social-links a:hover {
      color: #f4c271;
      transform: translateY(-2px);
      text-shadow: 0 0 18px rgba(231,166,70,.28);
    }

    .horizon {
      position: absolute;
      left: 50%;
      bottom: -21vw;
      transform: translateX(-50%);
      width: min(1500px, 145vw);
      aspect-ratio: 2 / 1;
      border-radius: 50% 50% 0 0;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255,174,63,.2) 0%, rgba(255,174,63,.05) 11%, transparent 38%),
        radial-gradient(ellipse at 28% 2%, rgba(222,129,24,.16) 0%, transparent 27%),
        linear-gradient(180deg, rgba(30,20,12,.72), rgba(5,5,6,.98) 42%, #030304 76%);
      border-top: 1px solid rgba(244,176,75,.33);
      box-shadow: 0 -10px 48px rgba(224,139,38,.14);
      z-index: -1;
      overflow: hidden;
    }

    .horizon::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 22% 18%, rgba(241,160,57,.12), transparent 2%),
        radial-gradient(circle at 30% 13%, rgba(241,160,57,.09), transparent 1.6%),
        radial-gradient(circle at 38% 17%, rgba(241,160,57,.1), transparent 1.5%),
        linear-gradient(8deg, transparent 0 54%, rgba(255,255,255,.017) 54.5% 55%, transparent 55.5% 100%),
        linear-gradient(-9deg, transparent 0 59%, rgba(255,255,255,.012) 59.3% 59.8%, transparent 60.2% 100%);
      opacity: .8;
    }

    footer {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      padding: 0 20px;
      color: #55545a;
      font-size: .64rem;
      letter-spacing: .22em;
      text-indent: .22em;
      text-transform: uppercase;
      z-index: 1;
    }

    @media (max-width: 700px) {
      .page { padding-top: 7vh; padding-bottom: 86px; }
      .mark-wrap { width: 210px; }
      .brand-name { margin-top: -58px; font-size: 2.3rem; letter-spacing: .18em; text-indent: .18em; }
      .studios { letter-spacing: .42em; text-indent: .42em; gap: 9px; }
      .tagline { letter-spacing: .27em; text-indent: .27em; line-height: 1.65; }
      .status { margin-top: 36px; }
      .social-links { margin-top: 25px; gap: 0; }
      .social-links a { min-width: auto; padding: 8px 14px; font-size: .64rem; }
      .horizon { bottom: -9vh; width: 180vw; }
      footer { bottom: 18px; font-size: .55rem; }
    }

    @media (max-height: 760px) and (min-width: 701px) {
      .page { padding-top: 18px; }
      .mark-wrap { width: 230px; }
      .brand-name { margin-top: -66px; font-size: 3rem; }
      .tagline { margin-top: 16px; }
      .status { margin-top: 28px; }
      .social-links { margin-top: 22px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="brand-glow" aria-hidden="true"></div>

    <div class="mark-wrap" aria-hidden="true">
      <img src="logo.png" alt="">
    </div>

    <h1 class="brand-name">NOVAFRAX</h1>
    <div class="studios">STUDIOS</div>
    <div class="tagline">A Shift in Perspective</div>

    <div class="status">Coming Soon</div>

    <nav class="social-links" aria-label="NOVAFRAX social links">
      <a href="https://youtube.com/@NovafraxStudios" target="_blank" rel="noopener noreferrer">YouTube</a>
      <a href="https://instagram.com/novafraxstudios" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a href="https://tiktok.com/@novafraxstudios" target="_blank" rel="noopener noreferrer">TikTok</a>
    </nav>

    <div class="horizon" aria-hidden="true"></div>

    <footer>&copy; 2026 NOVAFRAX STUDIOS. All Rights Reserved.</footer>
  </main>
</body>
</html>
