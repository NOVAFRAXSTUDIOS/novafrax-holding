<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVAFRAX STUDIOS | A Shift in Perspective</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .hero-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 177.78vh; /* يحافظ على نسبة 16:9 الدقيقة مع ارتفاع الشاشة */
      max-height: 56.25vw;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .hero-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
    }

    /* منطقة الروابط الشفافة المضبوطة بالميليمتر */
    .social-clickable-zone {
      position: absolute;
      bottom: 14.2%; /* تم رفعها لتغطي الأيقونة والكلمة تماماً */
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4.6%; /* ضبط التباعد ليتطابق مع أعمدة التصميم الثلاثة */
      width: 28%;
      height: 6.8%;
      z-index: 10;
    }
    .social-btn {
      flex: 1;
      height: 100%;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.25s ease;
      border-radius: 6px;
    }
    .social-btn:hover {
      opacity: 0.12;
      background: #fff;
    }
  </style>
</head>
<body>

  <div class="hero-container">
    <img src="hero.png" alt="Novafrax Studios" class="hero-image">
    
    <div class="social-clickable-zone">
      <a href="https://youtube.com/@rajulbiummah" target="_blank" class="social-btn" title="YouTube"></a>
      <a href="https://instagram.com" target="_blank" class="social-btn" title="Instagram"></a>
      <a href="https://tiktok.com" target="_blank" class="social-btn" title="TikTok"></a>
    </div>
  </div>

</body>
</html>
